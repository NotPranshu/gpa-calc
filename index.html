<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GPA Calculator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-brand">
      <img class="nav-logo" src="https://www.unifiji.ac.fj/wp-content/uploads/2022/02/viber_image_2022-02-04_11-32-02-502.png" alt="University of Fiji logo">
      <span class="nav-institution">The University of Fiji</span>
    </div>
    <h1 class="nav-title">GPA Calculator</h1>
    <div class="nav-spacer" aria-hidden="true"></div>
  </nav>

  <div class="app">
    <section class="gpa-display">
      <div class="gpa-value" id="gpaValue">&mdash;</div>
      <div class="gpa-label">Cumulative GPA</div>
      <div class="gpa-meta" id="gpaMeta">Add courses to get started</div>

      <div class="existing-gpa">
        <label class="existing-gpa-toggle">
          <input type="checkbox" id="hasExistingGpa">
          <span>I already have a GPA</span>
        </label>
        <div class="existing-gpa-fields" id="existingGpaFields" hidden>
          <label class="existing-gpa-field">
            <span>Current GPA</span>
            <input type="number" id="existingGpa" min="0" max="4.5" step="0.01" placeholder="e.g. 3.25">
          </label>
          <label class="existing-gpa-field">
            <span>Prior courses</span>
            <input type="number" id="priorCourses" min="1" step="1" placeholder="e.g. 8">
          </label>
        </div>
      </div>
    </section>

    <div class="main-content">
      <section class="courses-section">
        <div class="section-header">
          <h2>Courses</h2>
          <button type="button" class="btn btn-primary" id="addCourseBtn">+ Add Course</button>
        </div>
        <div id="coursesList" class="courses-list"></div>
      </section>

      <section class="scale-section">
        <h2>Grade Scale</h2>
        <table class="scale-table">
          <thead>
            <tr>
              <th>Grade</th>
              <th>Range</th>
              <th>GPA</th>
            </tr>
          </thead>
          <tbody id="scaleTableBody"></tbody>
        </table>
      </section>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
